<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tickets - Service Desk</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">Service Desk</a>
    <div class="flex align-center gap-4">
            <span style="font-size: 14px; color: var(--text-muted);">
                <strong th:text="${#authentication.name}">User</strong>
            </span>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="main-container animate-fade-in">
    <div class="card">
        <div class="flex justify-between align-center mb-4">
            <h2 style="margin: 0; border: none;">Tickets</h2>
            <div class="flex gap-4">
                <a href="/tickets/new" class="btn btn-primary">+ Create New Ticket</a>
                <a href="/" class="btn btn-secondary">Home</a>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Category</th>
                    <th>SLA Deadline</th>
                    <th>Author</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ticket : ${ticketPage.content}">
                    <td th:text="${ticket.id}" style="font-weight: 600;">1</td>
                    <td>
                        <a th:href="@{/tickets/{id}(id=${ticket.id})}" th:text="${ticket.title}" style="color: var(--primary-color); text-decoration: none;">Title</a>
                    </td>
                    <td>
                        <span class="badge" th:classappend="'badge-' + ${ticket.status}" th:text="${ticket.status}">NEW</span>
                    </td>
                    <td th:text="${ticket.category}">HARDWARE</td>
                    <td th:text="${ticket.slaDeadline}" th:style="${ticket.escalated} ? 'color: red; font-weight: bold;' : ''">2026-01-02</td>
                    <td th:text="${ticket.author.username}">user</td>
                    <td th:text="${ticket.createdAt}">2026-01-01</td>
                    <td>
                        <form th:action="@{/tickets/{id}/status(id=${ticket.id})}" method="post" style="display:inline-flex; gap: 6px;">
                            <select name="status" class="form-control" style="padding: 6px; width: auto; font-size: 12px;">
                                <option value="NEW">NEW</option>
                                <option value="IN_PROGRESS">IN_PROGRESS</option>
                                <option value="WAITING_FOR_USER">WAITING_FOR_USER</option>
                                <option value="RESOLVED">RESOLVED</option>
                                <option value="CLOSED">CLOSED</option>
                            </select>
                            <button type="submit" class="btn btn-primary btn-sm">Update</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${ticketPage.content.isEmpty()}">
                    <td colspan="8" class="text-center" style="padding: 30px; color: var(--text-muted);">
                        No tickets found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${pageNumbers != null}">
                <span th:each="pageNum : ${pageNumbers}">
                    <a th:href="@{/tickets(page=${pageNum}, size=${pageSize}, sortBy=${sortBy})}"
                       th:text="${pageNum}"
                       th:classappend="${pageNum == currentPage} ? 'active' : ''"
                       style="text-decoration: none;">1</a>
                </span>
        </div>
    </div>
</div>

</body>
</html>
