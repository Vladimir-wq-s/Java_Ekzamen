<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Service Desk</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flex align-center" style="justify-content: center; background-color: var(--bg-color); min-height: 100vh;">

<div class="card animate-fade-in" style="width: 100%; max-width: 400px;">
    <h2 class="text-center" style="border: none; margin-bottom: 8px;">Service Desk</h2>
    <p class="text-center" style="color: var(--text-muted); margin-bottom: 24px;">Sign in to your account</p>

    <div th:if="${param.error}" class="animate-fade-in" style="color: #dc2626; background-color: #fee2e2; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="animate-fade-in" style="color: #065f46; background-color: #d1fae5; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">
        You have been logged out.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In</button>
    </form>
</div>

</body>
</html>
