<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Ticket - Service Desk</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">Service Desk</a>
    <div class="flex align-center gap-4">
            <span style="font-size: 14px; color: var(--text-muted);">
                <strong th:text="${#authentication.name}">User</strong>
            </span>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="main-container animate-fade-in" style="max-width: 600px;">
    <div class="card">
        <h2>Create New Ticket</h2>
        <form th:action="@{/tickets/new}" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="Brief description of the issue" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="5" placeholder="Detailed information..." required></textarea>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-control" required>
                    <option value="HARDWARE">Hardware</option>
                    <option value="SOFTWARE">Software</option>
                    <option value="NETWORK">Network</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>
            <div class="flex gap-4 mt-4">
                <button type="submit" class="btn btn-primary">Submit Ticket</button>
                <a href="/tickets" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
